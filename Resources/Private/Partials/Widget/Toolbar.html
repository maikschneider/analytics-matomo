<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<form class="tx-analytics-matomo-toolbar" data-analytics-matomo-selection>
    <f:if condition="{allSites}">
        <f:else if="{selection.sites -> f:count()} > 1">
            <label>
                <span class="visually-hidden"><f:translate key="{ll}:widget.site" /></span>
                <select class="form-select form-select-sm" name="site">
                    <f:for each="{selection.sites}" as="site" key="identifier">
                        <option value="{identifier}" {f:if(condition: '{identifier} == {selection.site.identifier}', then: 'selected')}>{site.base.host}{site.base.path}</option>
                    </f:for>
                </select>
            </label>
        </f:else>
        <f:else>
            <input type="hidden" name="site" value="{selection.site.identifier}">
            <span class="tx-analytics-matomo-toolbar-site">{selection.site.base.host}{selection.site.base.path}</span>
        </f:else>
    </f:if>
    <label>
        <span class="visually-hidden"><f:translate key="{ll}:bar.period" /></span>
        <select class="form-select form-select-sm" name="period">
            <f:for each="{periods}" as="period">
                <option value="{period}" {f:if(condition: '{period} == {selection.period.preset}', then: 'selected')}><f:translate key="{ll}:period.{period}" /></option>
            </f:for>
            <f:if condition="{selection.period.preset} == 'custom'">
                <option value="custom" selected><f:format.date format="d.m.Y">{selection.period.from}</f:format.date> – <f:format.date format="d.m.Y">{selection.period.to}</f:format.date></option>
            </f:if>
        </select>
    </label>
    <f:if condition="{selection.period.preset} == 'custom'">
        <input type="hidden" name="from" value="{selection.period.from -> f:format.date(format: 'Y-m-d')}">
        <input type="hidden" name="to" value="{selection.period.to -> f:format.date(format: 'Y-m-d')}">
    </f:if>
</form>
</html>
