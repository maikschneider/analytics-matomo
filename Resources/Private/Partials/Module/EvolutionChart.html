<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<section data-evolution-chart="{chart -> f:format.json()}" data-current-label="{f:translate(key: '{ll}chart.current')}" data-previous-label="{f:translate(key: '{ll}chart.previous')}" class="card mb-4">
    <div class="card-header"><h2><f:translate key="{ll}chart.title" /></h2></div>
    <div class="card-body">
        <div class="row g-2 align-items-center mb-3">
            <div class="col-auto"><label class="form-label text-nowrap mb-0" for="matomo-chart-metric"><f:translate key="{ll}chart.metric" /></label></div>
            <div class="col-sm-6 col-lg-4">
                <select class="form-select" id="matomo-chart-metric" data-evolution-metric="true">
                    <f:for each="{chart.metrics}" as="metric" key="key">
                        <option value="{key}"><f:translate key="{sharedLabels}:metric.{key}" /></option>
                    </f:for>
                </select>
            </div>
        </div>
        <div class="tx-analytics-matomo-evolution-canvas">
            <canvas role="img" aria-label="{f:translate(key: '{ll}chart.title')}"><f:translate key="{ll}chart.fallback" /></canvas>
        </div>
        <f:if condition="{chart.annotations}">
            <details class="mt-3" data-chart-annotations>
                <summary><f:translate key="{ll}chart.annotations" arguments="{0: '{chart.annotations -> f:count()}'}" /></summary>
                <ul class="list-unstyled small mb-0 mt-2">
                    <f:for each="{chart.annotations}" as="annotation">
                        <li><time datetime="{annotation.date}">{annotation.date -> f:format.date()}</time>: {annotation.note}</li>
                    </f:for>
                </ul>
            </details>
        </f:if>
    </div>
</section>
</html>
