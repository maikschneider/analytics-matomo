<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<section data-evolution-chart="{chart -> f:format.json()}" data-current-label="{f:translate(key: '{ll}chart.current')}" data-previous-label="{f:translate(key: '{ll}chart.previous')}" class="mb-4">
    <h2><f:translate key="{ll}chart.title" /></h2>
    <label class="form-label">
        <f:translate key="{ll}chart.metric" />
        <select class="form-select" data-evolution-metric="true">
            <f:for each="{chart.metrics}" as="metric" key="key">
                <option value="{key}"><f:translate key="{sharedLabels}:metric.{key}" /></option>
            </f:for>
        </select>
    </label>
    <div class="tx-analytics-matomo-evolution-canvas">
        <canvas role="img" aria-label="{f:translate(key: '{ll}chart.title')}"><f:translate key="{ll}chart.fallback" /></canvas>
    </div>
</section>
</html>
