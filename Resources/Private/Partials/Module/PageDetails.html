<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<p><f:translate key="{ll}page.url" arguments="{0: pageDetails.url}" /></p>
<div class="tx-analytics-matomo tx-analytics-matomo--grid mb-3">
    <f:for each="{tiles}" as="tile">
        <f:render partial="Tile" arguments="{tile: tile, ll: sharedLabels, days: selection.period.days}" />
    </f:for>
</div>
<f:render partial="Module/EvolutionChart" arguments="{chart: chart, ll: ll, sharedLabels: sharedLabels}" />
<f:if condition="{pageDetails.languages}">
    <h2><f:translate key="{ll}page.languages" /></h2>
    <p class="text-body-secondary"><f:translate key="{ll}page.languages.hint" /></p>
    <div class="table-fit">
        <table class="table table-striped table-hover" data-languages>
            <thead>
                <tr>
                    <th scope="col"><f:translate key="{ll}page.languages.language" /></th>
                    <th scope="col" class="text-end"><f:translate key="{sharedLabels}:metric.views" /></th>
                    <th scope="col" class="text-end"><f:translate key="{sharedLabels}:metric.bounceRate" /></th>
                    <th scope="col" class="text-end"><f:translate key="{sharedLabels}:metric.averageTimeOnPage" /></th>
                </tr>
            </thead>
            <tbody>
                <f:for each="{pageDetails.languages}" as="language">
                    <tr class="{f:if(condition: language.current, then: 'active')}">
                        <th scope="row">
                            <core:icon identifier="{language.flag}" size="small" />
                            <f:if condition="{language.current}">
                                <f:then>{language.title}</f:then>
                                <f:else><a href="{language.url}">{language.title}</a></f:else>
                            </f:if>
                        </th>
                        <td class="text-end">{language.views}</td>
                        <td class="text-end">{language.bounceRate}</td>
                        <td class="text-end">{language.averageTimeOnPage}</td>
                    </tr>
                </f:for>
            </tbody>
        </table>
    </div>
</f:if>
<f:render partial="Module/Transitions" arguments="{transitions: pageDetails.transitions, transitionsUrl: pageDetails.transitionsUrl, ll: ll}" />
<f:if condition="{pageDetails.reading}">
    <h2><f:translate key="{ll}page.reading" /></h2>
    <p class="text-body-secondary"><f:translate key="{ll}page.reading.hint" /></p>
    <dl class="row" data-reading="estimate">
        <div class="col-sm-4">
            <dt><f:translate key="{ll}page.reading.timeOnPage" /></dt>
            <dd>{pageDetails.reading.timeOnPage}</dd>
        </div>
        <div class="col-sm-4">
            <dt><f:translate key="{ll}page.reading.readingTime" /></dt>
            <dd>{pageDetails.reading.readingTime} <small class="text-body-secondary"><f:translate key="{ll}page.reading.words" arguments="{0: pageDetails.reading.words}" /></small></dd>
        </div>
        <f:if condition="{pageDetails.reading.ratio}">
            <div class="col-sm-4">
                <dt><f:translate key="{ll}page.reading.ratio" /></dt>
                <dd>{pageDetails.reading.ratio}</dd>
            </div>
        </f:if>
    </dl>
</f:if>
<h2><f:translate key="{ll}page.speed" /></h2>
<p class="text-body-secondary"><f:translate key="{ll}page.speed.hint" /></p>
<dl class="row">
    <f:for each="{pageDetails.speed}" as="timing" key="key">
        <div class="col-sm-4" data-speed="{key}">
            <dt><f:translate key="{ll}page.speed.{key}" /></dt>
            <f:if condition="{timing.value}">
                <f:then>
                    <dd>{timing.value} <small class="text-body-secondary"><f:translate key="{ll}page.speed.samples" arguments="{0: timing.samples}" /></small></dd>
                </f:then>
                <f:else>
                    <dd class="text-body-secondary"><f:translate key="{ll}page.speed.tooFew" arguments="{0: minimumSamples}" /></dd>
                </f:else>
            </f:if>
        </div>
    </f:for>
</dl>
</html>
