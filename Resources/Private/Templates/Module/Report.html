<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Module" />
<f:section name="Content">
    <h1>{title}</h1>
    <f:if condition="{selection}">
        <p>
            {selection.site.identifier}: {selection.period.from -> f:format.date(format: 'Y-m-d')} – {selection.period.to -> f:format.date(format: 'Y-m-d')}
            <f:if condition="{selection.configuration.demo}"><span class="badge badge-warning"><f:translate key="{sharedLabels}:settings.demoData" /></span></f:if>
        </p>
        <p class="text-body-secondary"><f:translate key="{ll}language.hint" /></p>
        <form id="matomo-custom-range" action="{formAction}" method="post" class="mb-3">
            <input type="hidden" name="period" value="custom" />
            <fieldset>
                <legend><f:translate key="{ll}range.title" /></legend>
                <div class="d-flex flex-wrap align-items-center gap-2">
                    <label for="matomo-from"><f:translate key="{ll}range.from" /></label>
                    <input type="date" id="matomo-from" name="from" value="{selection.period.from -> f:format.date(format: 'Y-m-d')}" required="required" />
                    <label for="matomo-to"><f:translate key="{ll}range.to" /></label>
                    <input type="date" id="matomo-to" name="to" value="{selection.period.to -> f:format.date(format: 'Y-m-d')}" required="required" />
                    <button type="submit" class="btn btn-default"><f:translate key="{ll}range.apply" /></button>
                </div>
            </fieldset>
        </form>
    </f:if>
    <f:if condition="{emptyMessage}">
        <f:then>
            <div class="alert alert-info" role="status">{emptyMessage}<f:if condition="{errorMessage}"><br><small>{errorMessage}</small></f:if></div>
        </f:then>
        <f:else>
            <section data-report="{title}" data-site="{selection.site.identifier}" data-page="{pageId}" data-language="{language}">
                <f:if condition="{tiles}">
                    <f:then>
                        <dl class="row">
                            <f:for each="{tiles}" as="tile">
                                <div class="col-sm-4 mb-3">
                                    <dt><f:translate key="{sharedLabels}:metric.{tile.key}" /></dt>
                                    <dd>{tile.value}<f:if condition="{selection.compare}"> <small>{tile.trend}</small></f:if></dd>
                                </div>
                            </f:for>
                        </dl>
                    </f:then>
                    <f:else><p class="text-body-secondary"><f:translate key="{ll}report.placeholder" /></p></f:else>
                </f:if>
            </section>
        </f:else>
    </f:if>
</f:section>
</html>
