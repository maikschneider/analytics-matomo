<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Module" />
<f:section name="Content">
    <f:if condition="{refreshPageTree}"><span data-refresh-page-tree hidden></span></f:if>
    <h1>{title}</h1>
    <f:if condition="{selection}">
        <p>
            {selection.site.identifier}: {selection.period.from -> f:format.date(format: 'Y-m-d')} – {selection.period.to -> f:format.date(format: 'Y-m-d')}
            <f:if condition="{selection.configuration.demo}"><span class="badge badge-warning"><f:translate key="{sharedLabels}:settings.demoData" /></span></f:if>
        </p>
        <p class="text-body-secondary"><f:translate key="{ll}language.hint" /></p>
        <f:if condition="{reportHint}"><p class="text-body-secondary" data-report-hint>{reportHint}</p></f:if>
        <form id="matomo-custom-range" action="{formAction}" method="post" class="card mb-4"{f:if(condition: '{selection.period.preset} != \'custom\'', then: ' hidden')}>
            <input type="hidden" name="period" value="custom" />
            <fieldset class="card-body">
                <legend class="h3"><f:translate key="{ll}range.title" /></legend>
                <div class="row g-3 align-items-end">
                    <div class="col-sm-4 col-lg-3">
                        <label class="form-label" for="matomo-from"><f:translate key="{ll}range.from" /></label>
                        <input type="text" class="form-control" data-date-type="date" data-matomo-date id="matomo-from" name="from" value="{selection.period.from -> f:format.date(format: 'Y-m-d')}" required="required" />
                    </div>
                    <div class="col-sm-4 col-lg-3">
                        <label class="form-label" for="matomo-to"><f:translate key="{ll}range.to" /></label>
                        <input type="text" class="form-control" data-date-type="date" data-matomo-date id="matomo-to" name="to" value="{selection.period.to -> f:format.date(format: 'Y-m-d')}" required="required" />
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-default"><core:icon identifier="actions-check" size="small" /> <f:translate key="{ll}range.apply" /></button>
                    </div>
                </div>
            </fieldset>
        </form>
    </f:if>
    <f:if condition="{emptyMessage}">
        <f:then>
            <f:be.infobox state="-1">{emptyMessage}<f:if condition="{errorMessage}"><br><small>{errorMessage}</small></f:if></f:be.infobox>
        </f:then>
        <f:else>
            <section data-report="{title}" data-site="{selection.site.identifier}" data-page="{pageId}" data-language="{language}">
                <f:if condition="{pageDetails}">
                    <f:then>
                        <f:render partial="Module/PageDetails" arguments="{_all}" />
                    </f:then>
                    <f:else>
                        <f:render partial="Anomalies" arguments="{_all}" />
                        <f:if condition="{tiles}">
                            <div class="tx-analytics-matomo tx-analytics-matomo--grid mb-3">
                                <f:for each="{tiles}" as="tile">
                                    <f:render partial="Tile" arguments="{tile: tile, ll: sharedLabels, days: selection.period.days, descriptionPrefix: 'siteMetric'}" />
                                </f:for>
                            </div>
                            <f:render partial="Module/EvolutionChart" arguments="{chart: chart, ll: ll, sharedLabels: sharedLabels}" />
                        </f:if>
                        <f:if condition="{counters}">
                            <section class="card mb-4"><div class="card-header"><h2><f:translate key="{ll}overview.live" /></h2></div><div class="card-body">
                            <dl class="row">
                                <f:for each="{counters}" as="value" key="key">
                                    <div class="col-sm-4">
                                        <dt><f:translate key="{sharedLabels}:metric.{key}" /></dt>
                                        <dd data-counter="{key}">{value}</dd>
                                    </div>
                                </f:for>
                            </dl></div></section>
                        </f:if>
                        <f:for each="{tables}" as="table">
                            <f:render partial="Module/ReportTable" arguments="{table: table, ll: ll}" />
                        </f:for>
                    </f:else>
                </f:if>
            </section>
        </f:else>
    </f:if>
</f:section>
</html>
