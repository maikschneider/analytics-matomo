<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:variable name="ll" value="LLL:EXT:analytics_matomo/Resources/Private/Language/locallang.xlf" />
<f:if condition="{loading}">
    <f:then>
        <section
            class="tx-analytics-matomo tx-analytics-matomo--loading"
            aria-label="{f:translate(key: '{ll}:bar.label')}"
            aria-busy="true"
            data-url="{url}"
            data-days="{days}"
        >
            <f:render section="LoadingOverlay" arguments="{ll: ll}" />
        </section>
    </f:then>
    <f:else>
        <section class="tx-analytics-matomo" aria-label="{f:translate(key: '{ll}:bar.label')}" data-days="{days}">
            <f:if condition="{failed}">
                <f:then>
                    <div class="tx-analytics-matomo-message" role="alert">
                        <core:icon identifier="actions-exclamation-triangle-alt" size="small" />
                        <span>
                            <f:translate key="{ll}:bar.error" />
                            <f:if condition="{errorMessage}"><br><small>{errorMessage}</small></f:if>
                        </span>
                    </div>
                </f:then>
                <f:else>
                    <f:for each="{tiles}" as="tile">
                        <f:render partial="Tile" arguments="{tile: tile, days: days, ll: ll}" />
                    </f:for>
                </f:else>
            </f:if>
            <div class="tx-analytics-matomo-meta">
                <label class="visually-hidden" for="tx-analytics-matomo-days"><f:translate key="{ll}:bar.period" /></label>
                <select id="tx-analytics-matomo-days" class="form-select form-select-sm" data-analytics-matomo-days>
                    <f:for each="{periods}" as="period">
                        <option value="{period}" {f:if(condition: '{period} == {days}', then: 'selected')}>
                            <f:translate key="{ll}:bar.days" arguments="{0: period}" />
                        </option>
                    </f:for>
                </select>
                <a
                    class="tx-analytics-matomo-link"
                    href="{reportUrl}"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="{f:translate(key: '{ll}:bar.pageUrl', arguments: {0: target.pageUrl})}"
                >
                    <core:icon identifier="actions-window-open" size="small" />
                    <f:translate key="{ll}:bar.openMatomo" />
                </a>
            </div>
            <f:render section="LoadingOverlay" arguments="{ll: ll}" />
        </section>
    </f:else>
</f:if>

<f:section name="LoadingOverlay">
    <div class="tx-analytics-matomo-loading" aria-live="polite">
        <core:icon identifier="spinner-circle" size="small" />
        <span><f:translate key="{ll}:bar.loading" /></span>
    </div>
</f:section>
</html>
