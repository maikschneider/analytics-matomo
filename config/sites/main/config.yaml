# Development site: its base is a site tracked by the public Matomo demo, so the
# Page module shows real statistics for the root page after `ddev init-typo3`.
base: 'http://www.virtual-drums.com/'
rootPageId: 1
dependencies:
  - maikschneider/analytics-matomo
languages:
  -
    title: English
    enabled: true
    languageId: 0
    base: /
    locale: en_US.UTF-8
    navigationTitle: English
    flag: us
