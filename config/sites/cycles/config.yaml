base: 'https://analytics-matomo.ddev.site/'
rootPageId: 1
dependencies:
  - maikschneider/analytics-matomo
languages:
  -
    title: English
    enabled: true
    languageId: 0
    base: /
    locale: en_US.UTF-8
    navigationTitle: English
    flag: us
  -
    title: Deutsch
    enabled: true
    languageId: 1
    base: /de/
    locale: de_DE.UTF-8
    navigationTitle: Deutsch
    flag: de
    fallbackType: strict
  -
    title: Français
    enabled: true
    languageId: 2
    base: /fr/
    locale: fr_FR.UTF-8
    navigationTitle: Français
    flag: fr
    fallbackType: fallback
    fallbacks: '0'
errorHandling:
  -
    errorCode: 404
    errorHandler: Page
    errorContentSource: 't3://page?uid=23'
