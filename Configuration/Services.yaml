services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  MaikSchneider\AnalyticsMatomo\:
    resource: '../Classes/*'
    exclude: '../Classes/Dashboard/Widget/*'

  MaikSchneider\AnalyticsMatomo\Command\CheckAnomaliesCommand:
    autoconfigure: false
    tags:
      - name: console.command
        command: 'analytics-matomo:check-anomalies'
        description: 'Refresh daily traffic anomaly badges for configured Matomo sites'
        schedulable: true

  MaikSchneider\AnalyticsMatomo\Command\SendDigestCommand:
    autoconfigure: false
    tags:
      - name: console.command
        command: 'analytics-matomo:send-digest'
        description: 'Mail the weekly Matomo digest to backend groups that receive it'
        schedulable: true

  MaikSchneider\AnalyticsMatomo\Annotation\AnnotationWriter:
    tags:
      - name: messenger.message_handler

  cache.analytics_matomo:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['analytics_matomo']

  dashboard.widget.analyticsMatomoPerformance:
    class: MaikSchneider\AnalyticsMatomo\Dashboard\Widget\MatomoWidget
    arguments:
      $options:
        report: performance
        refreshAvailable: true
    tags:
      - name: dashboard.widget
        identifier: analyticsMatomoPerformance
        groupNames: analytics_matomo
        title: 'LLL:EXT:analytics_matomo/Resources/Private/Language/locallang.xlf:widget.performance'
        description: 'LLL:EXT:analytics_matomo/Resources/Private/Language/locallang.xlf:widget.performance.description'
        iconIdentifier: content-widget-number
        height: medium
        width: medium

  dashboard.widget.analyticsMatomoTraffic:
    class: MaikSchneider\AnalyticsMatomo\Dashboard\Widget\MatomoWidget
    arguments:
      $options:
        report: traffic
        refreshAvailable: true
    tags:
      - name: dashboard.widget
        identifier: analyticsMatomoTraffic
        groupNames: analytics_matomo
        title: 'LLL:EXT:analytics_matomo/Resources/Private/Language/locallang.xlf:widget.traffic'
        description: 'LLL:EXT:analytics_matomo/Resources/Private/Language/locallang.xlf:widget.traffic.description'
        iconIdentifier: content-widget-chart
        height: medium
        width: medium

  dashboard.widget.analyticsMatomoTopPages:
    class: MaikSchneider\AnalyticsMatomo\Dashboard\Widget\MatomoWidget
    arguments:
      $options:
        report: topPages
        refreshAvailable: true
    tags:
      - name: dashboard.widget
        identifier: analyticsMatomoTopPages
        groupNames: analytics_matomo
        title: 'LLL:EXT:analytics_matomo/Resources/Private/Language/locallang.xlf:widget.topPages'
        description: 'LLL:EXT:analytics_matomo/Resources/Private/Language/locallang.xlf:widget.topPages.description'
        iconIdentifier: content-widget-list
        height: large
        width: medium

  dashboard.widget.analyticsMatomoSites:
    class: MaikSchneider\AnalyticsMatomo\Dashboard\Widget\MatomoWidget
    arguments:
      $options:
        report: sites
        refreshAvailable: true
    tags:
      - name: dashboard.widget
        identifier: analyticsMatomoSites
        groupNames: analytics_matomo
        title: 'LLL:EXT:analytics_matomo/Resources/Private/Language/locallang.xlf:widget.sites'
        description: 'LLL:EXT:analytics_matomo/Resources/Private/Language/locallang.xlf:widget.sites.description'
        iconIdentifier: content-widget-list
        height: medium
        width: medium
